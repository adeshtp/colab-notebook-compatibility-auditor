[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-audit"
version = "0.1.0"
description = "Static compatibility risk auditing for old Google Colab notebooks"
requires-python = ">=3.11"

[project.optional-dependencies]
# Everything needed to run the explanation layer, whether or not a Groq key is set.
# `ollama` is not optional: src/explainer.py imports agno.models.ollama at module
# level, and that module imports the `ollama` package. Omitting it makes the whole
# application unimportable, which is what CI caught.
llm = [
    "agno>=3.1,<4",
    "groq>=0.30",
    "ollama>=0.6",
    "lancedb>=0.40",
    "sentence-transformers>=6.1",
    "openai>=3",
]
ui = ["streamlit>=1.65"]
dev = ["pytest>=9.1", "pyflakes>=3"]

[tool.setuptools]
# src/ is a flat script directory, not an installed package: there are no
# __init__.py files and the modules import each other by bare name. Use
# PYTHONPATH=src rather than installing it. An editable install does not work on
# Python 3.14, which skips the setuptools .pth file because its name starts with
# "__", so the install appears to succeed and then fails to import.
package-dir = { "" = "src" }
py-modules = ["notebook_parser", "runtime_checker", "rules", "models",
              "knowledge_base", "explainer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# RAG tests build a real local LanceDB index. Only the marked test makes a live
# provider call, and it skips itself unless RUN_OLLAMA_TESTS=1 is set.
markers = ["integration: makes a live Ollama call, opt-in via RUN_OLLAMA_TESTS=1"]