[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colab-audit"
version = "0.1.0"
description = "Static compatibility risk auditing for old Google Colab notebooks"
requires-python = ">=3.11"

[project.optional-dependencies]
llm = [
    "agno>=3.1,<4",
    "lancedb>=0.40",
    "sentence-transformers>=6.1",
    "ollama>=0.6",
]
ui = ["streamlit>=1.65"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Local RAG tests build a real LanceDB index; the live model call is integration only.
markers = ["integration: requires the local Ollama model to be running"]